name: release

# S1 起启用：push 到 main 或打 tag 时，自动 bump 版本 → 编两个 deb（roothide + rootless，
# ARCHS = arm64 arm64e）→ 发 Release 并附 SHA256SUMS。
# S0 只有骨架，所有构建步骤都用 if 守卫住，不会造成假绿。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  DEB_ROOTLESS: com.vboxai.littlefatlady.rootless
  DEB_ROOTHIDE: com.vboxai.littlefatlady

jobs:
  guard:
    name: 前置检查
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.chk.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: chk
        run: |
          if [ -f packages/ios/Makefile ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::packages/ios/Makefile 还不存在（S0），跳过构建。"
          fi

  version:
    name: 版本
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.ready == 'true'
    outputs:
      deb: ${{ steps.v.outputs.deb }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          V=$(cat VERSION)
          B=$(git rev-list --count HEAD)
          echo "deb=${V}-${B}" >> "$GITHUB_OUTPUT"
          echo "deb-version = ${V}-${B}"

  build:
    name: 构建 deb (${{ matrix.variant }})
    runs-on: macos-15
    needs: [guard, version]
    if: needs.guard.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        variant: [rootless, roothide]
    steps:
      - uses: actions/checkout@v4
      - name: 装 Theos
        run: |
          export THEOS=$RUNNER_TEMP/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
      - name: 编包
        run: |
          cd packages/ios
          make clean package FINALPACKAGE=1 \
               ARCHS="arm64 arm64e" TARGET=iphone:clang:latest:17.0 \
               PACKAGE_VERSION="${{ needs.version.outputs.deb }}" \
               VARIANT="${{ matrix.variant }}"
      - name: 验收（arm64e 必须在）
        run: |
          f=$(find packages/ios -name '*.deb' | head -1)
          test -n "$f" || { echo "没编出 deb"; exit 1; }
          mkdir -p x && dpkg-deb -R "$f" x
          lib=$(find x -name '*.dylib' | head -1)
          lipo -info "$lib" | tee /tmp/lipo.txt
          grep -q arm64e /tmp/lipo.txt || { echo "缺 arm64e"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.variant }}
          path: packages/ios/**/*.deb

  publish:
    name: 发 Release
    runs-on: ubuntu-latest
    needs: [guard, version, build]
    if: needs.guard.outputs.ready == 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          cd dist && sha256sum *.deb | tee SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.deb }}
          name: v${{ needs.version.outputs.deb }}
          files: |
            dist/*.deb
            dist/SHA256SUMS
          body: |
            自动构建：`${{ needs.version.outputs.deb }}`
            - rootless：`${{ env.DEB_ROOTLESS }}`
            - roothide：`${{ env.DEB_ROOTHIDE }}`
            素材许可 CC BY-NC-SA 4.0（禁商用），来源见 LICENSE-ASSETS。
