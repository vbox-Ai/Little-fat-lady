name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selfcheck:
    name: 仓库自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: check-repo
        run: node scripts/check-repo.mjs
      - name: 版本打印
        run: |
          echo "VERSION=$(cat VERSION)"
          echo "BUILD=$(git rev-list --count HEAD)"
          echo "deb-version=$(cat VERSION)-$(git rev-list --count HEAD)"

  build:
    name: 构建 deb（rootless · arm64+arm64e）
    needs: selfcheck
    # macOS runner 偶尔会排队到 15 分钟被 cancel（2026-11-16 出现过三次空转）。
    # 真遇到就把下面这行换成 ubuntu-latest：工具链步骤里有 runner.os 分支，
    # 但 Linux 的 ld64 目前还没打通（Theos 需要 Darwin 版 ld64）。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 装工具链（Theos + ldid + dpkg）
        if: runner.os == 'macOS'
        run: |
          set -e
          brew install ldid dpkg || true
          export THEOS="$RUNNER_TEMP/theos"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          rm -rf "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "ldid: $(command -v ldid || echo MISSING)"
          echo "dpkg-deb: $(command -v dpkg-deb || echo MISSING)"

      - name: 装工具链（Linux 备用）
        if: runner.os == 'Linux'
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq make clang lld dpkg fakeroot \
            libplist-dev libplist++-dev pkg-config libssl-dev zlib1g-dev \
            libncurses-dev git curl unzip zip
          # ldid：Theos 签名必需，Ubuntu 源里没有，源码编一个
          if ! command -v ldid >/dev/null; then
            # 不能 --depth 1：ldid 的 Makefile 要 `git describe` 取版本号
            git clone https://github.com/ProcursusTeam/ldid.git "$RUNNER_TEMP/ldid"
            make -C "$RUNNER_TEMP/ldid" -j"$(nproc)"
            sudo install -m 0755 "$RUNNER_TEMP/ldid/ldid" /usr/local/bin/ldid
          fi
          echo "ldid: $(command -v ldid || echo MISSING)"
          echo "dpkg-deb: $(command -v dpkg-deb || echo MISSING)"
          export THEOS="$RUNNER_TEMP/theos"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          rm -rf "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          # Theos 在 Linux 上默认找 $THEOS/toolchain/linux/iphone/bin/clang（官方 LLVM 包）。
          # 那个包装下来 400MB+，这里直接把系统 clang/ld.lld/llvm-lipo 链进去，效果一样。
          sudo apt-get install -y -qq llvm
          TOOLBIN="$THEOS/toolchain/linux/iphone/bin"
          mkdir -p "$TOOLBIN"
          ln -sf "$(command -v clang)" "$TOOLBIN/clang"
          ln -sf "$(command -v clang++)" "$TOOLBIN/clang++"
          ln -sf "$(command -v ld.lld)" "$TOOLBIN/ld"
          ln -sf "$(command -v ld.lld)" "$TOOLBIN/ld64"
          LIPO=$(ls /usr/bin/llvm-lipo* 2>/dev/null | head -1)
          [ -n "$LIPO" ] && ln -sf "$LIPO" "$TOOLBIN/lipo"
          ln -sf "$(command -v ldid)" "$TOOLBIN/ldid"
          ls "$TOOLBIN"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "sdks: $(ls "$THEOS/sdks" | head -5 | tr '\n' ' ')"

      - name: 拉素材包（上游 0.4.9 · 114 段转码版）
        env:
          PACK_URL: https://github.com/vbox-Ai/Little-fat-lady/releases/download/pack-upstream-0.4.9-a/assets-pack-upstream-0.4.9-a.zip
        run: |
          set -e
          curl -fL --retry 4 --retry-delay 3 -o "$RUNNER_TEMP/pack.zip" "$PACK_URL"
          ls -lh "$RUNNER_TEMP/pack.zip"
          mkdir -p "$RUNNER_TEMP/pack"
          unzip -q "$RUNNER_TEMP/pack.zip" -d "$RUNNER_TEMP/pack"
          DEST="packages/ios/layout/Library/Application Support/DSHPet"
          mkdir -p "$DEST"
          cp -R "$RUNNER_TEMP/pack/." "$DEST/"
          # 只留分桶素材：平铺的演示片（idle.mov 等）会跟真素材抢同一类别，
          # 抽签时一半概率抽到占位蓝水母——这是 0.1.0-52 的真机现象。
          rm -f "$DEST"/*.mov
          echo "color 桶：$(ls "$DEST/color" | tr '\n' ' ')"
          echo "素材桶："; ls "$DEST"
          echo "总大小：$(du -sh "$DEST" | cut -f1)"

      - name: 编译
        run: |
          BUILD=$(git rev-list --count HEAD)
          sh scripts/build-deb.sh "$BUILD"

      - name: 验收（arm64e 必须在 + 包结构）
        run: |
          set -e
          deb=$(ls packages/ios/packages/*.deb packages/ios/*.deb 2>/dev/null | head -1)
          echo "deb = $deb"
          mkdir -p unpack && dpkg-deb -R "$deb" unpack
          lib=$(find unpack -name 'DSHPet.dylib' | head -1)
          echo "lib = $lib"
          # Linux 上没有 lipo，用 file 看 fat 头（universal binary 会列出每个切片）
          file "$lib" | tee /tmp/lipo.txt
          grep -q arm64e /tmp/lipo.txt || { echo "::error::缺 arm64e 切片"; exit 1; }
          echo "--- control ---"
          dpkg-deb -I "$deb"
          echo "--- 文件树 ---"
          find unpack -maxdepth 6 -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: dshpet-deb-s1
          path: |
            packages/ios/packages/*.deb
            packages/ios/*.deb
          retention-days: 30

  # 下一步（S2 起）：roothide 变体（patcher.sh 打补丁）、IPA 伴生、Release 自动发。
